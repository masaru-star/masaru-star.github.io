<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>相互リンク | 真優の開発工廠</title><link rel="stylesheet" href="style.css"></head><body>
<div data-site-header></div><main><div class="container"><header class="page-heading"><p class="eyebrow">Mutual links</p><h1>相互リンク</h1><p class="lead">相互リンク先を掲載するページです。</p></header><article class="content-card"><p class="mutual-intro">掲載内容は <code>data.js</code> の <code>reciprocalLinksData</code> オブジェクトで管理しています。</p><div id="mutual-links-list" class="grid links-grid"></div><p id="mutual-empty" class="empty" hidden>現在、掲載中の相互リンクはありません。</p></article></div></main><div data-site-footer></div><script src="site.js"></script><script src="data.js"></script><script>renderSiteChrome('mutual-links.html'); const target = document.getElementById('mutual-links-list'); target.innerHTML = reciprocalLinksData.map(link => `<a class="card link-card" href="${link.url}" target="_blank" rel="noopener noreferrer"><div><h2>${link.title}</h2><p>${link.desc}</p></div></a>`).join(''); document.getElementById('mutual-empty').hidden = reciprocalLinksData.length !== 0;</script></body></html>
